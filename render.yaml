services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: vardaan-backend
    env: python
    rootDir: Vardan-phase-01-main/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true

  # 2. React (Vite) Frontend Static Site
  - type: web
    name: vardaan-frontend
    env: static
    rootDir: Vardan-phase-01-main/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vardaan-backend
          property: host